# Default values for html-comments.

image:
  repository: html-comments
  # Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Comments are stored as JSON files on disk with no cross-process locking,
# so run a single replica.
replicaCount: 1

serviceAccount:
  # Create a ServiceAccount for the pod. When false and name is empty, the
  # pod runs as the namespace's "default" ServiceAccount.
  create: false
  # Name of the ServiceAccount to use (created when create is true; defaults
  # to the release fullname).
  name: ""
  # Annotations for the created ServiceAccount — how cloud IAM binds to pods,
  # e.g. eks.amazonaws.com/role-arn (IRSA) or iam.gke.io/gcp-service-account
  # (GKE Workload Identity).
  annotations: {}

service:
  type: ClusterIP
  port: 4747
  # Pod port (name or number) the Service routes to. Defaults to the app
  # container's port; point it at a sidecar's port when e.g. an auth proxy
  # in extraContainers terminates traffic in front of the app.
  targetPort: http
  # Service annotations, e.g. cloud load-balancer healthcheck/TLS config.
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: html-comments.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# The directory of .html/.md/.json/.jsonl/image files to serve, mounted at /content.
# Pick exactly one source; if none is set, an emptyDir is used (starts empty —
# useful when another process, e.g. a sidecar or agent, writes files into it).
content:
  existingClaim: ""
  hostPath: ""
  readOnly: true

# Where comment JSON is persisted, mounted at /comments.
comments:
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    # Annotate the created PVC with helm.sh/resource-policy: keep, so
    # `helm uninstall` leaves the comment data behind instead of deleting it.
    keepOnUninstall: true

# Extra environment variables for the container. For a writable deployment
# (HTTP publishing + rename/archive) also set content.readOnly: false, e.g.:
#   env:
#     UPLOADS_ENABLED: "1"
#     TRUST_IDENTITY_HEADER: "X-Forwarded-Email"
env: {}

# Extra sidecar containers (e.g. an authenticating reverse proxy, or a
# process syncing files into /content). Rendered through tpl, so values may
# use template expressions.
extraContainers: []

# Extra volumes / mounts for the app container, rendered through tpl.
extraVolumes: []
extraVolumeMounts: []

resources: {}
  # limits:
  #   cpu: 250m
  #   memory: 256Mi
  # requests:
  #   cpu: 50m
  #   memory: 64Mi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
