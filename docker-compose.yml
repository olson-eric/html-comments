services:
  html-comments:
    build: .
    image: html-comments:latest
    ports:
      - "${PORT:-4747}:4747"
    environment:
      # Optional path prefix to mount the app under, e.g. /reviews
      BASE_PATH: "${BASE_PATH:-}"
      # Opt-in HTTP publishing (uploads/rename/archive). Requires a writable
      # content mount: also set CONTENT_MODE=rw.
      UPLOADS_ENABLED: "${UPLOADS_ENABLED:-}"
      UPLOAD_MAX_BYTES: "${UPLOAD_MAX_BYTES:-}"
      # Identity header from an auth proxy in front of the app, e.g.
      # X-Forwarded-Email. Only set when a proxy strips inbound copies.
      TRUST_IDENTITY_HEADER: "${TRUST_IDENTITY_HEADER:-}"
    volumes:
      # Directory of .html/.md/.json/.jsonl/image files to serve. Read-only by default;
      # set CONTENT_MODE=rw when UPLOADS_ENABLED=1. Defaults to the sample
      # ./html directory in this repo — point HTML_DIR at your own files.
      - ${HTML_DIR:-./html}:/content:${CONTENT_MODE:-ro}
      # Comment JSON persists here across container restarts
      - comments:/comments
    restart: unless-stopped
    init: true

volumes:
  comments:
