<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>html-comments — viewer</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Apply the saved (or OS-preferred) theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('hc:theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="viewer">
    <header class="viewer-header">
      <a href="./" class="brand">← Files</a>
      <div class="viewer-title">
        <h1 id="page-title">…</h1>
        <nav id="page-path" class="path breadcrumb" aria-label="Folder breadcrumb"></nav>
      </div>
      <div class="viewer-actions">
        <label class="toggle">
          <input type="checkbox" id="hide-resolved" />
          <span>Hide resolved</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="dark-page" />
          <span title="Best-effort dark rendering of the document itself">Dark page</span>
        </label>
        <label class="author-input">
          <span>You:</span>
          <input type="text" id="author" placeholder="Your name" />
        </label>
        <div class="share-wrap" id="share-wrap" hidden>
          <button id="share-btn" type="button" aria-haspopup="true" aria-expanded="false">Share</button>
          <div id="share-popover" class="copy-link-popover share-popover" hidden>
            <label class="share-option">
              <input type="radio" name="share-vis" value="everyone" />
              <span><strong>Everyone</strong> — anyone on this deployment</span>
            </label>
            <label class="share-option">
              <input type="radio" name="share-vis" value="shared" />
              <span><strong>Specific people</strong></span>
            </label>
            <textarea id="share-emails" rows="2" placeholder="one email per line or comma-separated" hidden></textarea>
            <label class="share-option">
              <input type="radio" name="share-vis" value="private" />
              <span><strong>Private</strong> — only you</span>
            </label>
            <p class="copy-link-hint" id="share-owner-hint" hidden></p>
            <button id="share-save" type="button">Save</button>
          </div>
        </div>
        <div class="export-wrap">
          <button id="export-btn" type="button" aria-haspopup="menu" aria-expanded="false" disabled>Export</button>
          <div id="export-menu" class="export-menu" role="menu" hidden>
            <a id="export-raw" role="menuitem" download>Raw file</a>
            <button id="export-pdf" type="button" role="menuitem">PDF…</button>
          </div>
        </div>
        <button id="edit-document" class="secondary" type="button" hidden>Edit</button>
        <button id="copy-link" type="button">
          <span class="copy-state copy-state--idle">Copy link</span>
          <span class="copy-state copy-state--done" aria-hidden="true">
            <svg class="copy-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 13l4 4L19 7" />
            </svg>
            Copied
          </span>
        </button>
        <button class="theme-toggle" data-theme-toggle type="button" aria-label="Toggle dark mode">🌙</button>
      </div>
    </header>

    <main class="viewer-main">
      <section class="page-pane">
        <iframe id="page-frame" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
        <div id="editor-stage" class="editor-stage" hidden>
          <div class="editor-toolbar">
            <div>
              <strong id="editor-title">Edit document</strong>
              <span id="editor-status" class="muted" role="status"></span>
            </div>
            <div class="editor-actions">
              <button id="editor-cancel" class="secondary" type="button">Cancel</button>
              <button id="editor-save" type="button">Save</button>
            </div>
          </div>
          <div class="editor-panels">
            <label class="editor-panel editor-source-panel">
              <span>Source</span>
              <textarea id="document-source" spellcheck="false" aria-label="Document source"></textarea>
            </label>
            <section class="editor-panel editor-preview-panel" aria-label="Rendered preview">
              <span>Preview</span>
              <iframe id="editor-preview" sandbox="allow-same-origin" title="Rendered preview"></iframe>
            </section>
          </div>
        </div>
        <div id="image-stage" class="image-stage" hidden>
          <div class="image-wrap">
            <img id="page-image" alt="" draggable="false" />
            <div id="image-overlay" class="image-overlay"></div>
          </div>
        </div>
        <div id="pdf-stage" class="pdf-stage" aria-label="PDF document" hidden>
          <div id="pdf-loading" class="pdf-loading">Loading PDF…</div>
          <div id="pdf-pages" class="pdf-pages"></div>
        </div>
        <div id="add-comment-popover" class="add-comment-popover" hidden>
          <button id="start-comment">💬 Add comment</button>
        </div>
      </section>

      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Comments</h2>
          <select id="filter">
            <option value="open">Open</option>
            <option value="all">All</option>
            <option value="resolved">Resolved</option>
            <option value="deleted">Deleted</option>
          </select>
        </div>
        <div class="agent-dispatch">
          <button id="send-to-agent" type="button" disabled>Send to agent</button>
          <button id="copy-agent-instructions" class="secondary icon-button" type="button" title="copy agent instructions" aria-label="Copy agent instructions">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2" />
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
            </svg>
          </button>
          <span id="agent-status" class="muted">No open comments</span>
        </div>
        <div id="comments-list" class="comments-list"></div>
        <template id="composer-template">
          <div class="composer">
            <div class="composer-quote"></div>
            <textarea placeholder="Add a comment… (markdown supported)" rows="3"></textarea>
            <div class="markdown-preview" hidden></div>
            <div class="composer-actions">
              <span class="composer-hint">Markdown supported</span>
              <button data-action="cancel" class="secondary">Cancel</button>
              <button data-action="save">Comment</button>
            </div>
          </div>
        </template>
      </aside>
    </main>

    <dialog id="name-dialog" class="name-dialog" aria-labelledby="name-dialog-title">
      <form id="name-form" method="dialog">
        <h2 id="name-dialog-title">What’s your name?</h2>
        <p>Enter your name so your comments are attributed to you.</p>
        <label for="name-input">Your name</label>
        <input id="name-input" type="text" autocomplete="name" required />
        <button type="submit">Continue</button>
      </form>
    </dialog>

    <script src="theme.js"></script>
    <script src="markdown.js"></script>
    <script src="anchor-resolver.js"></script>
    <script src="viewer-links.js"></script>
    <script src="viewer.js"></script>
  </body>
</html>
