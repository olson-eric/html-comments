<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>html-comments — viewer</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Apply the saved (or OS-preferred) theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('hc:theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="viewer">
    <header class="viewer-header">
      <a href="./" class="brand">← Files</a>
      <div class="viewer-title">
        <h1 id="page-title">…</h1>
        <nav id="page-path" class="path breadcrumb" aria-label="Folder breadcrumb"></nav>
      </div>
      <div class="viewer-actions">
        <label class="toggle">
          <input type="checkbox" id="hide-resolved" />
          <span>Hide resolved</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="dark-page" />
          <span title="Best-effort dark rendering of the document itself">Dark page</span>
        </label>
        <label class="author-input">
          <span>You:</span>
          <input type="text" id="author" placeholder="Your name" />
        </label>
        <div class="copy-link-wrap">
          <div class="copy-link-split">
            <button id="copy-link" type="button">
              <span class="copy-state copy-state--idle">Copy link</span>
              <span class="copy-state copy-state--done" aria-hidden="true">
                <svg class="copy-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 13l4 4L19 7" />
                </svg>
                Copied
              </span>
            </button>
            <button id="copy-link-arrow" type="button" aria-label="Copy link for a specific recipient" aria-haspopup="true" aria-expanded="false">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9l6 6 6-6" />
              </svg>
            </button>
          </div>
          <div id="copy-link-popover" class="copy-link-popover" hidden>
            <label>
              <span>Link is for</span>
              <input type="text" id="copy-link-name" placeholder="Recipient's name (optional)" autocomplete="off" />
            </label>
            <p class="copy-link-hint">Their comments will default to this name instead of Anonymous.</p>
            <button id="copy-link-confirm" type="button">Copy link</button>
          </div>
        </div>
        <button class="theme-toggle" data-theme-toggle type="button" aria-label="Toggle dark mode">🌙</button>
      </div>
    </header>

    <main class="viewer-main">
      <section class="page-pane">
        <iframe id="page-frame" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
        <div id="image-stage" class="image-stage" hidden>
          <div class="image-wrap">
            <img id="page-image" alt="" draggable="false" />
            <div id="image-overlay" class="image-overlay"></div>
          </div>
        </div>
        <div id="add-comment-popover" class="add-comment-popover" hidden>
          <button id="start-comment">💬 Add comment</button>
        </div>
      </section>

      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Comments</h2>
          <select id="filter">
            <option value="open">Open</option>
            <option value="all">All</option>
            <option value="resolved">Resolved</option>
          </select>
        </div>
        <div id="comments-list" class="comments-list"></div>
        <template id="composer-template">
          <div class="composer">
            <div class="composer-quote"></div>
            <textarea placeholder="Add a comment… (markdown supported)" rows="3"></textarea>
            <div class="markdown-preview" hidden></div>
            <div class="composer-actions">
              <span class="composer-hint">Markdown supported</span>
              <button data-action="cancel" class="secondary">Cancel</button>
              <button data-action="save">Comment</button>
            </div>
          </div>
        </template>
      </aside>
    </main>

    <script src="theme.js"></script>
    <script src="markdown.js"></script>
    <script src="viewer.js"></script>
  </body>
</html>
