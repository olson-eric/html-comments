# Keeps the three pinned supply chains current: npm packages, the
# SHA-pinned GitHub Actions, and the digest-pinned Docker base image.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
